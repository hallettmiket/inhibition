# The target, and the decisions a screen needs before it can run.
#
# The tool is target-agnostic; this file is where a target stops being a
# hard-coded assumption. Everything below is either a fact about the target or a
# rule with a measured basis -- never a number someone picked.
#
# 3.0.0. Prior numbers do not survive this file: sub-splitting, per-mode
# selection, physiological salt and the pH 7.4 docked species each change what is
# measured, and together they invalidate every 2.2.0 value (CHANGELOG rule).

# WHERE THIS DATASET LIVES. Named here so the tool can screen a different one:
# every module resolves paths through `shared/run_paths`, which reads these, and
# a literal `/data/lab_vm/.../inhibition` in code is a tool that only ever works
# on this dataset on this filesystem. @tt8804: "we are building a tool that can
# be reused for searching different datasets, nothing should be hardcoded".
paths:
  governed: /data/lab_vm/append_only/inhibition    # append-only, hook-protected
  scratch:  /data/lab_vm/modifiable/inhibition     # trajectories, workdirs
  agent:    blacksmith                             # outputs/<agent>/<topic>/
  # THE CANDIDATE LIBRARIES, per generation tier. A screen of another dataset
  # names its own frames here instead of editing six scripts.
  frames:
    T3: 03_t3_reinvent/D3
    T4: 04_t4_combinatorial/D4
  # Prepared receptors live under scratch, named after the PDB in `target`, so
  # changing the target moves them without a code change.
  receptor_prep: receptor_{pdb}_prep/{PDB}_noligand.pdb
  receptor_plain: receptor_{pdb}_plain

# THE RUN EVERY DOWNSTREAM STAGE MEANS BY "THE SCREEN".
#
# One name, read by the ranking, the GUIs and the sweep worklist, so they cannot
# disagree about which screen they are describing. Before this existed the
# production run was whichever topic happened to own the un-suffixed filename,
# and three separate scripts each decided that with their own `== "nac_v3"`
# test -- which is how 3.0.0's ranking silently read 2.1.0's aggregates.
run:
  # 3.1.0 full re-run: T_4 across acrylamide + bdhi_c4 + bdhi_c5, at the
  # decided spec throughout (D0081 T_4 only, D0085 8 ns / 0.35 nm).
  #
  # BUMPING THIS IS THE WHOLE CEREMONY NOW. Every stage that takes --topic
  # defaults to it (tc.topic()), so the screen, the ranking, the worklist and
  # the representative rebuild move together. Previously six scripts each
  # carried their own literal and a re-run without explicit flags would have
  # written the screen to nac_v3 and the worklist to nac_v4.
  #
  # nac_v4 (3.0.0 "Galena") stays on disk, unreferenced. Its GUI is archived
  # browsable at 00_outputs/blacksmith/gui_archive/galena_3.0.0_20260816/.
  # nac_v8 (3.3.1). nac_v7 IS RETIRED AS BROKEN, not superseded: every distance
  # and angle in it was measured against pose 1's Cys113 sulfur for all 640
  # poses (D0109), which under-counted `viable` by roughly half. Its tables stay
  # on disk because the root is append-only; nothing may read them. A fresh
  # topic rather than a re-screen into nac_v7 because `rank_v2` concatenates
  # every agg_s*.csv in a topic and would count every mode twice.
  topic: nac_v8              # 3.3.1. Bump with the screen, never on its own.
                             # A CLEAN RUN, carrying nothing from nac_v5: that
                             # data predates the #76 pose_idx fix, so its poses
                             # cannot be joined to their own measurements; it was
                             # split by a rule whose modes are mixtures (D0088,
                             # D0098); and its clouds carry no energies (D0096).

  # WHICH GENERATION TIERS ARE RANKED (@tt8804, 2026-08-12: "we are only doing
  # t_4"). Applied BEFORE ranking, so `class_rank` is a position among the
  # molecules actually in contention rather than a position in a list two thirds
  # of which is not.
  #
  # THIS IS WHY ACRYLAMIDE LOOKED LIKE THE LIBRARY. T_3 is REINVENT de novo
  # output and it is 96% acrylamide -- 4,062 of 4,249 acrylamide molecules, and
  # 19,888 of the 34,059 modes. Every other warhead class is 100% T_4 at 162-188
  # molecules. So "acrylamide is 76% of the in-scope modes" was a statement about
  # which generator ran, not about which chemistry is promising, and the depth it
  # implied (85 modes clearing the floor) was 84 T_3 rows and one T_4 row.
  #
  # T_3 rows stay on disk and stay screened; this decides what is RANKED and
  # therefore what the GUI shows and what the sweep can select.
  tiers: ["T4"]

target:
  name: Pin1
  domain: catalytic          # the PPIase domain, not the WW domain
  pdb: 3IKD                  # chemist-prepared; replaced 6VAJ in D0059
  anchor: Cys113             # the residue the warhead must reach
  anchor_atom: SG

# ---------------------------------------------------------------------------
# Pose generation and splitting
# ---------------------------------------------------------------------------
docking:
  # 640 SO THAT 500 POSES SURVIVE POSEBUSTERS, not 640 for its own sake. See
  # `target_pb_valid` below for why the target is on the VALID count. Sized from
  # the measured pass rate over nac_v6's 561 acrylamide/bdhi molecules -- the
  # same set this run screens -- rather than from a margin someone chose:
  #
  #     quantile   pass rate   n_runs for 500 valid
  #      median      0.920            544
  #      5th pct     0.864            579
  #      1st pct     0.834            600
  #      MINIMUM     0.812            616   <- 640 clears this with margin
  #
  # At the worst rate observed anywhere in that set, 640 runs yield 520 valid.
  # Well under the ~2,000 where AutoDock-GPU starts failing silently (#77).
  n_runs: 640                # per molecule; sized to yield >=500 PB-valid
  persist_all_poses: true    # #44 -- a rule, not an option. The cloud must come
                             # from the SAME run that produced the scores.
  # 500 runs give >=95% probability of sampling at least one pose within 2 A of
  # the true one PROVIDED the per-run hit rate exceeds 0.597% (>=99% at 0.917%).
  # Sulfopin's measured rate is 20.8% [17.4, 24.8], where 13 runs would do.
  sampling_floor_p: 0.00597
  # THE DOCKING SEED (#77). AutoDock-GPU seeds its GA from the clock unless told
  # otherwise, so a re-screen drew a different cloud and produced a different
  # ranking -- v4 vs v5 agreed at rho = +0.43 over 504 shared molecules. Fixing
  # it makes a run reproducible, which is the precondition for A/B-ing any
  # scoring change. It does NOT make the ranking stable (D0086); it fixes which
  # draw you get. Set to null for independent draws, which is what a replicate
  # experiment wants.
  seed: 42

  # POSEBUSTERS VALIDITY GATE (D0089 -- adopted there, built 2026-08-27).
  #
  # What it buys, from D0089's own measurements rather than the hope: attack-ready
  # poses pass at 98.57% against 92.80% for the rest (odds ratio 5.35, Fisher
  # p = 1.9e-23), because its clash threshold of 0.75x the vdW sum is 2.625 A for
  # the reactive carbon against Cys113 SG -- BELOW the near-attack window's 2.8 A
  # floor -- so it rejects poses that are too CLOSE. And it does NOT improve the
  # ranking: rho = 0.9989 on per-mode viable_fraction, top-25 overlap 25/25,
  # median rank movement zero places. Validity, reproducibility and an equal
  # denominator; not a better answer. That qualification IS the decision.
  #
  # Invalid poses are FLAGGED, not deleted: they keep their per-pose row and
  # their place in the persisted cloud with `pb_valid = False`, and are excluded
  # only from grouping and the aggregates. D0093 is the record of what a filter
  # that deletes costs.
  # SAMPLE TO A FIXED NUMBER OF *VALID* POSES (@twu383, 2026-09-01).
  #
  # `consensus` = mode_size / n_poses, and n_poses was the number DOCKED --
  # equal at 500 for everything, which looked like an equal denominator and was
  # not one. Only PB-valid poses can join a mode, and that fraction ranges
  # 0.812-0.982 across this set, so a molecule at 81% valid had a consensus
  # CEILING of 0.81 while one at 98% could reach 0.98. The comparison was
  # between numerators with unequal room to grow.
  #
  # Setting the target on the valid count equalises both. 0 disables the cap and
  # restores the previous behaviour exactly, which is what reproduces nac_v6.
  #
  # WHICH 500, when a cloud overshoots: the FIRST 500 in docking order. The runs
  # are independent GA replicates, so that is an unbiased sample of the valid
  # population and the cloud keeps meaning "what docking produces". An ENERGY
  # cut would make it "the best-scoring 500" -- a different population, and
  # exp/21 measured that the best 25% of a cloud concentrates attack-ready poses
  # 2.60x over a random 25%, so it would inflate `engagement` for reasons that
  # are not chemistry.
  target_pb_valid: 500

  posebusters:
    enabled: true
    config: dock         # 22 checks INCLUDING protein clashes -- what D0089
                         # measured. `mol` is 12 ligand-only checks and cannot
                         # see the clash at all (93.0% valid vs 99.8%).
    max_workers: 6       # 32 shards x 6 = 192 cores of 224. EXCEEDS the
                         # documented compute.MAX_CPU_WORKERS (50) on @tt8804 explicit
                         # instruction to finish asap, on a box measured idle
                         # (load 0.49, no other GPU user). Measured: 86 s -> 20 s
                         # 16 or 32 workers buy nothing beyond 8.

splitting:
  # WHICH SPLITTER RUNS. Named here rather than defaulted in code, because two
  # rules that both produce integer labels are indistinguishable downstream and
  # the whole pipeline would happily consume either.
  #
  #   warhead_dbscan   the shipped two-stage rule (stage1 + stage2 below).
  #                    D0088: it clusters on the reactive atom's position and
  #                    warhead direction, then grades each group by how often it
  #                    reaches attack geometry -- which IS position and
  #                    direction. It forms groups along the axis it grades them
  #                    on, and the median mode spans 3.51 A.
  #   contact_linkage  shared/pose_contacts.split_poses. Complete linkage over
  #                    weighted residue-contact distance, bounding within-group
  #                    distance structurally. Measured: median within-group RMSD
  #                    1.12 A against 9.3 A bags, 91% of >=5-pose groups found in
  #                    all five independent dockings, 100% persistence under 12x
  #                    deeper sampling (D0092, D0095).
  #
  # STILL warhead_dbscan, deliberately. Every frame, ranking, sweep result and
  # 100 ns run on disk was produced under it; switching the default re-groups
  # every cloud and makes them incomparable in a way nothing in the artefacts
  # would announce. The switch happens WITH the re-screen (#79), not before it.
  method: contact_linkage
  # SWITCHED FOR nac_v6, with the re-screen and not before it (D0097). Every
  # frame under nac_v5 was produced by warhead_dbscan; the two are not
  # comparable, which is why the topic moves at the same time.

  contact_linkage:
    landmarks: 15            # exp/14's greedy non-redundant pick, top 15 = 90%
                             # of contact-matrix variance; order identical across
                             # five independent dockings (Spearman 1.000)
    tolerance: null          # null = the molecule's predicted RMSF / 2.21.
                             # D0094: that constant is near-constant across
                             # molecules and does not beat a flat number
                             # (p = 0.515). Set a float here to pin one instead.

  # Stage 1: mechanistically meaningful modes. Clustered on the reactive atom's
  # position and the direction the warhead points -- never on energy, never on
  # the NAC geometry that is later scored.
  stage1: warhead_position_and_direction
  # Stage 2 (#61): the first stage is blind to everything but the warhead, so a
  # mode can hold poses 5 A apart elsewhere in the molecule and one
  # representative would stand for both.
  stage2:
    enabled: true
    cut_diameter_a: 2.0      # tied to the accuracy being claimed, not chosen
    max_sub: 5               # 97% of the achievable recovery; k=5 vs k=9 p=1.00
    min_mode_size: 12
  # Measured on the 82-case benchmark, recovery of the crystal pose within 2 A:
  #   1 representative 22.0% | 4 -> 39.0% (14 gained, 0 lost, p=1.2e-4) | 9 41.5%

# ---------------------------------------------------------------------------
# What earns a simulation (#59)
# ---------------------------------------------------------------------------
sweep_rule:
  # NOT a depth. A rank cut cannot travel between targets: rank is an ordinal
  # within one warhead class of one library. The floor is on `enrichment`, which
  # is viable_fraction / isotropic_null -- dimensionless, defined identically for
  # every class and target, already null-normalised per mechanism so it absorbs
  # the SN2-vs-perpendicular difficulty gap.
  # SWITCHED TO GEOMETRY FOR nac_v6 (D0098). `enrichment` was measured against
  # the MD outcome over 147 swept modes and predicts it at rho = -0.043; the
  # column the ranking used, conditional_eb, at rho = -0.015 -- neither
  # distinguishable from chance. A group's engagement geometry is what predicts
  # it (rho = +0.652 for the pose actually simulated).
  parameter: engagement
  floor: null                # MEASURED PER TARGET, never inherited. null until
                             # the pilot below has run and been read.
  capture_target: 0.95       # the floor must retain 95% of productive modes;
                             # missing one costs a candidate, a wasted sweep
                             # costs ~0.5 GPU-h, and the asymmetry is the point
  pilot:
    design: stratified_on_viable_fraction
    strata: ["0-0", "0.0001-0.05", "0.05-0.10", "0.10-0.15", "0.15-1.0"]
    n_per_stratum: 30        # +/-18 pp on a rate near 0.5; the zero stratum is
                             # one-sided, where 0/30 bounds it at 10% (rule of 3)
    spread_across_classes: true
  select_by: per_mode        # #53 -- NOT one pose per molecule. 2.2.0 sent mode 0
                             # for 242 of 242 molecules while ranking per mode,
                             # and 5 modes that rank FIRST in their class were
                             # never simulated.

  # -------------------------------------------------------------------------
  # WHICH CHEMISTRY EARNS A SIMULATION, AND HOW DEEP (@tt8804, 2026-08-12)
  # -------------------------------------------------------------------------
  # A CAMPAIGN DECISION, NOT A TARGET PROPERTY. The screen still screens all
  # nine warhead classes and their rows stay on disk; this gates only what earns
  # GPU time. Narrowing the screen instead would throw away the comparison that
  # makes an enrichment floor meaningful, and the excluded classes are the
  # control group for "is this class worth carrying next time".
  #
  # The three families are the chemistry the lab will actually synthesise.
  # Dropping the other four removes 618 of 5,397 molecules but only 4,303 of
  # 31,505 modes -- 14%. Scope is NOT what makes this affordable; depth is.
  scope:
    # POOLING WITHIN A FAMILY IS STATISTICALLY CLEAN, and that was checked
    # rather than assumed: `enrichment` is viable_fraction / isotropic_null, and
    # all five classes below carry isotropic_null = 0.0816 -- bdhi is
    # sn2_ring_opening, the other two michael_addition, and the null is
    # identical. So the two-class families rank on one scale.
    # @tt8804, 2026-08-12: "just sweep the two bdhi lists and acrylamide".
    # THREE LISTS, and bdhi_c4/bdhi_c5 are kept SEPARATE rather than pooled as one
    # bdhi family. Pooling them is statistically legitimate -- same mechanism,
    # identical isotropic_null -- but they are two different warheads a chemist
    # makes differently, and pooling lets the larger list (c5: 1,073 estimable
    # modes against c4's 789) absorb the quota. Each list gets its own.
    #
    # naphthoquinone is descoped. It was the largest block in the ranking (36 of
    # the top 100 molecules) and its rows remain on disk, so this is reversible by
    # adding the two classes back here -- nothing else needs to change.
    families:
      acrylamide: [acrylamide]
      bdhi_c4:    [bdhi_c4]
      bdhi_c5:    [bdhi_c5]

  # PER FAMILY, NOT GLOBAL, AND THAT IS THE WHOLE POINT OF THE QUOTA. Since all
  # three families share a null they COULD be ranked in one list -- and then
  # acrylamide, which is 4,223 of the 4,779 in-scope molecules and 76% of the
  # in-scope modes, would take essentially every slot. The library is lopsided
  # because of how it was generated, not because acrylamides are more promising,
  # and the deliverable is a top-5 a chemist can choose across warhead
  # chemistries. Equal depth per family buys that diversity explicitly.
  # NON-BINDING AT THE CURRENT FLOOR, AND SAID SO DELIBERATELY. On the 3.0.0
  # ranking the floor stops each list well short of this: bdhi_c5 at 136,
  # acrylamide at 85, bdhi_c4 at 57. The cap exists so a future target whose
  # chemistry is richer cannot silently commit months of GPU time -- it is a
  # backstop, not the operative rule. The worklist logs which of the two bound.
  max_depth: 150

  # A BUDGET FLOOR, AND IT IS DELIBERATELY NOT `floor` ABOVE. `floor` is the
  # capture-validated threshold: the one the pilot measures, that provably keeps
  # 95% of productive modes. It is still null and must stay null until that pilot
  # runs. This is a different quantity with a different justification -- the
  # enrichment below which we decline to spend GPU time -- and giving it the same
  # name would let a budget decision be read as a chemistry result.
  #
  # Measured on the 3.0.0 ranking, modes clearing each floor (2 GPUs, 20.9 min
  # median per sweep):
  #
  #     floor   acryl    bdhi   naphtho   total   days
  #      2.0    3,828     643      706    5,177   37.6
  #      3.0    1,385     455      482    2,322   16.9
  #      4.0      803     308      347    1,458   10.6   <- set here
  #      5.0      423     197      225      845    6.1
  #
  # 4.0 WITH max_depth 400 IS CHOSEN FOR ITS SHAPE, not just its total. bdhi
  # (308) and naphthoquinone (347) both fall UNDER the cap, so they are limited
  # by chemistry and run to exhaustion; only acrylamide is truncated on budget,
  # and acrylamide is the family that is over-represented for reasons of library
  # construction rather than promise. Run the two smaller families first and they
  # are complete in 4.8 days, with acrylamide open-ended after that.
  #
  # WHAT IS STILL UNPROVEN. That docking-derived enrichment predicts sweep
  # outcome at all. Class rank was at chance for it (AUC 0.518 over 188 swept
  # modes), and enrichment has not been tested the same way because the 2.2.0
  # sweeps were run on modes that no longer exist. Until the pilot runs, this
  # floor is a spending rule, not a claim about which molecules react.
  # ON THE ENGAGEMENT SCALE (0-1), NOT THE ENRICHMENT SCALE. The previous value
  # of 4.0 was a ratio against the isotropic null; carrying it across unchanged
  # would have admitted nothing, since no engagement score can exceed 1.
  #
  # DERIVED, NOT PICKED. Over the 147 modes with a measured sweep outcome, as a
  # floor on the simulated pose's engagement:
  #
  #     floor   kept   precision   lift   recall
  #      0.00   100%      44%      1.00x   100%     (the base rate)
  #      0.05    27%      87%      1.97x    52%     <- the elbow, adopted
  #      0.20    19%      96%      2.18x    42%
  #      0.40    10%     100%      2.26x    23%
  #
  # Precision jumps from the base rate to 87% at 0.05 and then plateaus while
  # recall falls away, so tightening past it spends recall for almost no gain.
  #
  # TWO CAVEATS THAT KEEP THIS A SPENDING RULE RATHER THAN A RESULT. It is
  # derived from the SIMULATED POSE's engagement, and a group's engagement under
  # contact linkage is a related but different quantity; and those 147 modes
  # were selected for sweeping by conditional_eb, so the curve is measured inside
  # the band the incumbent already liked. `sweep_rule.floor` stays null -- the
  # capture-validated threshold still needs its own pilot and is not this.
  budget_floor: 0.05

  # ESTIMABILITY, AND IT IS NOT THE SAME TEST AS THE FLOOR. `enrichment` is
  # viable_fraction / null, and viable_fraction is a proportion measured on the
  # poses IN THE MODE. On two poses it can only be 0, 0.5 or 1.0 -- and 1.0 gives
  # enrichment 12.25, the arithmetic ceiling, from two observations. Measured on
  # the 3.0.0 ranking, of the modes clearing enrichment 4.0 that the consensus
  # gate had excluded: 589 held 0-3 poses, 452 held 4-11, 157 held 12-24, and
  # NONE held 25 or more. The top of that list is noise wearing a maximum score.
  #
  # A floor on enrichment cannot catch this, because a tiny mode's enrichment is
  # high rather than low. The size requirement is a separate, prior question: is
  # this proportion estimable at all? 12 matches `splitting.stage2.min_mode_size`
  # -- the same number below which a cluster is not treated as a mode.
  #
  # NOTE this is NOT the `consensus >= 0.05` gate in rank_v2, which is a fraction
  # OF THE CLOUD and therefore conflates a small mode with a large cloud. After
  # sub-splitting that gate leaves 52.5% of modes unranked (median consensus
  # 0.052, sitting exactly on its own threshold) where 2.2.0 left 18.7%. Sweeping
  # keys on absolute size instead, which does not move when the cloud does.
  min_mode_poses: 12

  # A FREE EXCLUSION, IF IT HOLDS. Modes with viable_fraction == 0 have no docked
  # pose meeting the near-attack criterion, so they clear no floor above zero:
  # 30% of acrylamide, 61% of bdhi, 67% of naphthoquinone. Whether such a mode
  # can still sweep productive is the single most valuable thing the pilot
  # measures, which is why its design samples that stratum one-sidedly.

  # THE COST BASIS IS MEASURED, NOT ASSUMED. Over 251 completed 10 ns sweeps the
  # median end-to-end wall time is 20.9 min (p90 30.4; mdrun itself 18.6 min at
  # 774 ns/day, the rest setup). On two GPUs that is 138 sweeps/day:
  #
  #     depth/family    sweeps   days (median)   days (p90)
  #        100            300         2.2            3.2
  #        150            450         3.3            4.7
  #        250            750         5.4            7.9      <- set here
  #        500          1,500        10.9           15.8
  #
  # Sweeping every in-scope mode -- 29,255 projected -- would take 212 days, so
  # a cap is not a refinement, it is the only thing that makes this runnable.
  #
  # THE CAP AND THE FLOOR ARE COMPLEMENTARY AND BOTH APPLY. The floor says "do
  # not simulate this even if there is budget"; the cap says "there is no more
  # budget even if it clears the floor". Whichever binds first wins, and a run
  # must report which did -- a shortlist that stopped on budget is a different
  # claim from one that stopped on chemistry.
  #
  # STILL TO CHECK, ONCE THE 3.0.0 RANKING EXISTS: how many DISTINCT MOLECULES
  # the top 250 modes of a family cover. Sub-splitting puts ~5.8 modes on each
  # molecule, so if a family's top modes cluster onto a few molecules, 250 modes
  # could be 45 compounds -- enough for a top-5, but worth knowing rather than
  # discovering later.

# ---------------------------------------------------------------------------
# What earns a RANK (#65)
# ---------------------------------------------------------------------------
ranking:
  # WHICH SCORE THE GUI READS, per tier. Named here because `mode_ranking.gather`
  # used to hardcode `conditional_eb`, so a run ranked on anything else was
  # invisible to every page and reported as "no ranked modes yet".
  score_by_tier:
    T4: engagement          # D0098: the only score measured to predict the MD
                            # outcome (rho +0.652 vs -0.015 for conditional_eb)
    T3: enrichment_conditional
  # WHICH MODES ARE REAL ENOUGH TO ORDER. A rank is a claim that one mode beat
  # another, so a mode whose score is not estimable must not hold a position --
  # it displaces one that is.
  #
  # THIS REPLACES `consensus >= 0.05`, AND THE TWO ARE THE SAME KIND OF TEST
  # WEARING DIFFERENT UNITS. `consensus` is exactly mode_size / n_poses (checked:
  # true for all 34,059 rows), and every cloud on this run holds 500 poses -- so
  # the old gate was, precisely, `n_poses_mode >= 25`. The smallest mode that
  # passed it holds 25 poses. Nothing measured 25; it is what 0.05 of 500 comes
  # to.
  #
  # WRITING A SIZE FLOOR AS A FRACTION MAKES IT MOVE WHEN THE WORKLOAD DOES.
  # Raise `docking.n_runs` to 1,000 and the same 0.05 silently becomes "at least
  # 50 poses", roughly halving what is ranked, with nothing in any output saying
  # the gate changed. That is the timeout-sized-for-a-smaller-pool defect in a
  # different costume (`docs/how_this_project_breaks.md`, disguise #3), and it is
  # why the rule below counts poses instead.
  #
  # 12 IS THE MEASURED NUMBER AND IT IS ALREADY IN THIS FILE. It is
  # `sweep_rule.min_mode_poses`, itself tied to `splitting.stage2.min_mode_size`
  # -- the size below which a cluster is not treated as a mode at all. Of the
  # modes clearing enrichment 4.0 that the old gate excluded, 589 held 0-3 poses
  # and 452 held 4-11: correctly excluded, noise wearing a maximum score. The
  # 157 holding 12-24 were not, and they are what this recovers.
  #
  # MEASURED EFFECT on the 3.0.0 ranking: 17,238 -> 21,637 modes ranked (50.6% ->
  # 63.5%), 4,399 gained and 0 lost; among modes clearing enrichment 4.0, 325 ->
  # 518. Nothing is re-docked and no score changes -- only which modes are
  # allowed to hold a position.
  # THE EMPIRICAL-BAYES PRIOR'S MINIMUM STRENGTH, in poses (@tt8804,
  # 2026-08-18). Method of moments fits the prior to the population's spread,
  # and this population is heterogeneous enough that it collapses to ~2.2
  # poses -- effectively no shrinkage, which let thinly-evidenced modes win.
  # Measured on 2,721 scorable modes, raising it to 10 moves
  # rho(score, mode_size) from +0.143 to -0.016: LESS size-biased, which is
  # what the shrinkage was for. Still far below the median evidence
  # (n_in_range = 26), so it only bites where the estimate is thin.
  eb_prior_min_strength: 10.0
  mode_gate:
    parameter: n_poses_mode  # absolute, so it does not move with the cloud
    min_poses: 12            # == sweep_rule.min_mode_poses; asserted by a test
  # The old rule, kept REACHABLE so 3.0.0's earlier tables can be reproduced
  # rather than only described. `rank_v2 --floor 0.05 --gate consensus_fraction`.
  legacy_consensus_floor: 0.05

  # HOW A MOLECULE'S SCORE IS BUILT FROM ITS MODES' `rank_score` (@tt8804,
  # 2026-08-29, after reading the curves). `mean`, and the alternatives are NOT
  # interchangeable -- measured on nac_v6's 1,684 molecules the top-50 by `mean`
  # and the top-50 by `best` share TWO members. They answer different questions:
  #
  #   mean  -- what fraction of this molecule's accessible poses are
  #            reaction-competent. A typical-behaviour measure.
  #   best  -- can this molecule reach attack geometry AT ALL. A capability
  #            measure, and arguably the mechanistically right one for an
  #            irreversible warhead, which only has to arrive once.
  #
  # `mean` was chosen on the SHAPE OF ITS CURVE: it decays smoothly and almost
  # linearly from 0.249 across the top of the ranking, where `fraction_above`
  # gave five parallel curves that ordered molecules without separating them
  # (every cutoff from 0.05 to 0.60 left ~100% of molecules with a qualifying
  # mode). No cutoff is involved, which is the point -- `fraction_above`
  # reintroduced at the molecule level exactly the hard threshold that
  # `anchor_quality` exists to remove.
  #
  # THE CAVEAT THAT TRAVELS WITH IT: the denominator is the mode COUNT, and
  # that is a function of docking depth (D0092). Measured here,
  # rho(n_modes, mean) = -0.118, p = 1.2e-06 -- dock deeper, accumulate sparse
  # poor modes, and a molecule's mean falls without its chemistry changing. The
  # effect is small and one-directional, and it is why `mean` is comparable
  # ACROSS MOLECULES AT FIXED DEPTH and nowhere else. Do not compare a mean
  # from a 500-run cloud against one from a 2,000-run cloud. `best` is the only
  # option here that is depth-immune.
  ligand_agg: fraction_above
  # THE CUTOFF, DERIVED RATHER THAN CHOSEN (@tt8804, 2026-08-29: "from first
  # principles lets determine a cutoff"). The previous value, 0.4, was picked as
  # the midpoint of a usable range and then given a chemical-sounding gloss
  # after the fact. It corresponded to no criterion anyone had defined.
  #
  # THE DERIVATION. `anchor_quality = d_term x a_term`, and both factors are
  # bounded in [0, 1]. A PRODUCT >= 0.5 THEREFORE FORCES EACH FACTOR >= 0.5 --
  # if either fell below, the product could not reach 0.5 even with the other at
  # its maximum. And each factor at 0.5 is exactly the classical NAC window:
  #
  #     d_term >= 0.5  <=>  2.8 <= d <= 4.2 A
  #     a_term >= 0.5  <=>  theta <= 30 degrees off-normal
  #
  # So `anchor_quality >= 0.5` IMPLIES the pose sits inside the NAC window. It
  # is the SUFFICIENT condition, and it admits no pose the window excludes.
  # Verified numerically: at a perfect angle it admits 2.81-4.20 A, at a perfect
  # distance up to 30 degrees.
  #
  # 0.25 IS THE OTHER PRINCIPLED VALUE and it is the wrong one here. It is the
  # window's CORNER (4.2 A and 30 degrees at once), so everything inside the
  # window scores at least 0.25 -- the NECESSARY condition. But it also admits
  # 45 degrees off-normal at a perfect distance, which is outside the window.
  # Counting "reaction-competent modes" wants no false positives, so the
  # sufficient condition is the right one.
  ligand_cutoff: 0.5
  # AND THE CUTOFF IS APPLIED TO THE ANCHOR, NOT TO `rank_score`. This is the
  # part that is easy to get wrong: `rank_score = anchor x support`, support
  # runs to 1.15, so a pose with anchor 0.44 -- OUTSIDE the window -- reaches
  # rank_score 0.506 on a Ser114/115 hydrogen bond. Measured on nac_v6, 1,448
  # modes clear 0.5 on `rank_score` with an anchor below 0.5: admitted by a
  # bonus rather than by geometry. A geometric criterion applied to a quantity
  # that is not purely geometric silently widens the window by 15%, and nothing
  # in the output would say so.
  #
  # SUPPORT SHAPES THE ORDERING, NOT THE CRITERION. That is what "conservative,
  # supporting rules only" has to mean: the H-bond can move a competent mode up
  # the list; it must never make an incompetent one competent.
  ligand_cut_col: anchor_quality_max
  ligand_tiebreak: mean_mode_engagement

# ---------------------------------------------------------------------------
# Simulation
# ---------------------------------------------------------------------------
md:
  # MEASURED at 0.1 ns resolution over the 168 finished sweeps -- see
  # docs/sweep_length.md and scripts/exp_sweep_length.py. At the 0.35 nm bar the
  # optimum is 8.3 ns; 8.0 is inside the plateau and is the round number.
  #
  # THE OPTIMUM IS A PLATEAU, NOT A POINT, and the earlier "9.0 ns" overstated
  # it. Pass rate is a STEP function -- it moves only when one of 168 traces
  # crosses the bar, 0.60% per step -- so the argmax lands wherever a molecule
  # happens to cross. Between 9.0 and 9.6 nothing crosses at all and the decline
  # there is pure sweep-cost arithmetic. Total variation across 8-10 ns is 3.7%.
  # Bootstrap 95% CI at this bar: 4.3-9.5 ns.
  #
  # What the data DOES establish: below ~7 ns falls away steeply (5 ns is 18%
  # down at the 0.5 bar), and past 10 ns the curve declines on sweep cost alone.
  # The exchange rate is why the gate should be generous rather than short: one
  # 100 ns run costs as much as 66 ns of sweeping one mode.
  # TRIAGE LENGTH: 5 ns (@tt8804, 2026-08-19), down from 8. See D0087.
  #
  # SAFE IN THE DIRECTION THAT MATTERS. D0085 measured the optimum as a PLATEAU
  # with a bootstrap 95% CI of 4.3-9.5 ns, so 5 sits inside the interval that
  # produced 8. And truncation is one-sided -- max@5 <= max@8 -- so a shorter
  # sweep can never drop a genuine survivor from the set, only admit extras that
  # the 100 ns stage then rejects. The cost of being wrong here is GPU time, not
  # a lost candidate.
  #
  # WHY NOW: the fine pose split (0.1 nm, no cap) raises the worklist from ~5 to
  # ~25 modes per molecule. At 4.10 min/ns measured over 251 sweeps, 8 -> 5 ns
  # takes a mode from 32.8 to 20.5 min. That is a 37% cut per mode against a 5x
  # larger worklist, so it softens the increase rather than absorbing it.
  # 1.2 ns TRIAGE (@tt8804, 2026-08-27). NOT the measured optimum and must not be
  # read as one: D0085 put the yield peak at 8.3 ns with a bootstrap 95% CI of
  # 4.3-9.5 ns, and 1.2 ns is well OUTSIDE that interval, so D0087's "safe
  # because it sits inside the CI" argument does not carry over to it.
  #
  # WHAT MAKES IT SAFE IS TRUNCATION, NOT THE PLATEAU. The bar is one-sided:
  # anything that would clear 5 ns also clears 1.2 ns, so a shorter sweep cannot
  # LOSE a survivor. It admits more false positives instead.
  #
  # WHAT IT COSTS, MEASURED: pass rate rises 10.7% -> 36.3%, so the sweep gets
  # 4.2x cheaper (141 -> 34 GPU-h over 413 modes) while the 100 ns stage it feeds
  # gets 3.4x dearer (199 -> 675 GPU-h). End to end the yield per GPU-hour halves,
  # 43.4 -> 20.8. This is therefore a STANDALONE TRIAGE setting. Anyone going on
  # to 100 ns should put it back to 5 ns first.
  sweep_ps: 1200

  # ---------------------------------------------------------------------------
  # THREE MD TIERS (D0101). Each is a filter on the one before, at the SAME bar.
  #
  #   tier 1  triage_ps      1,200 ps   300 modes -> 90 held
  #   tier 2  screen_ps     10,000 ps   the cull that pays for tier 3
  #   tier 3  production_ps 100,000 ps  the result
  #
  # WHY A MIDDLE TIER EXISTS AT ALL. Straight from 1.2 ns to 100 ns costs 615
  # GPU-h for the 90 survivors. Culling at 10 ns first costs 122 -- a 80% saving
  # -- because a 100 ns run is 83x a 1.2 ns one, so an hour spent culling buys
  # far more than an hour saved.
  #
  # WHY 10 ns AND NOT 5. THE BAR IS NESTED: max ligand RMSD over a longer window
  # is >= the max over a shorter one, so anything that holds 100 ns necessarily
  # held 10 ns and 5 ns. A longer tier 2 therefore CANNOT lose a tier 3 survivor
  # -- it is a pure cost trade with no recall risk, and culling harder always
  # wins. Measured against exp_sweep_length's curve, over the 90:
  #
  #     tier 2   -> tier 3   tier2 GPU-h   tier3 GPU-h   TOTAL
  #      3 ns        46           18           313        331
  #      5 ns        27           31           182        212
  #      8 ns        18           49           121        170
  #     10 ns         9           62            61        122   <- adopted
  #
  # At 10 ns the two stages balance (62 against 61 GPU-h), which is the optimum;
  # and 10 ns is the edge of what exp_sweep_length measured (0.1-10 ns), so going
  # longer is not defensible without new data.
  #
  # THE PASS RATES ARE TRANSFERRED, NOT MEASURED ON THIS COHORT. They come from
  # exp_sweep_length's UNCONDITIONAL curve over the nac_v5 ranked list; our 90
  # are pre-selected by both 1.2 ns and engagement, so their true rate at 10 ns
  # is probably higher and tier 3 will receive more than 9. The nesting argument
  # is unaffected; the arithmetic is an estimate.
  tiers:
    triage_ps: 1200
    screen_ps: 10000
    production_ps: 100000
  production_ps: 100000
  salt_molar: 0.15           # #57. Every 2.2.0 system was built with
                             # `addions ... 0` -- neutralise and stop -- so none
                             # had salt, at ~0 M against a cell's 0.15
  # THE SURVIVOR BAR for the triage sweep (@tt8804). 0.35 nm -- a strict reading
  # of "minimally moving", not the 1.2 nm used for the 100 ns "held" verdict.
  #
  # It is severe: 12 of 168 modes pass (7.1%), against 39 at 0.5 nm. The screen
  # is deliberately trading recall for cost -- only the poses that barely move
  # earn a 100 ns run.
  #
  # ONE PIECE OF EVIDENCE POINTS THE OTHER WAY and is recorded here rather than
  # lost: of the first three 100 ns runs, the only one that HELD (0.83 nm over
  # 100 ns) had a 10 ns sweep RMSD of 0.483 -- this bar rejects it -- while the
  # two that flew out at ~6 nm sat at 0.465 and 0.473, also rejected. n = 3, so
  # it decides nothing, but if the pattern holds the bar is cutting into real
  # candidates and should be revisited once more 100 ns rows exist.
  sweep_survivor_rmsd_nm: 0.35
  # THE OPTIMAL BAR for a finished 100 ns run (@tt8804, 2026-08-18). Separate
  # from the sweep bar above, which it used to share.
  #
  # One number across both timescales made "optimal" unreachable by construction
  # rather than by chemistry: a ligand explores more in 100 ns than in 8, and
  # after 13 finished runs the tightest was 0.410 nm with a hard floor there --
  # 0 optimal, 9 held, 4 left. 0.45 sits just above that floor, so the tier
  # separates the shortlist from the rest instead of being empty. The 1.0 nm
  # dissociation criterion is unchanged and still decides held vs left.
  production_optimal_rmsd_nm: 0.45
  # THE CLEAN-HOLD FLOOR (@tt8804, 2026-08-18). Fraction of frames within
  # bound_rmsd_nm that a run must reach to count as held rather than
  # unstable. "Never dissociated" alone was too generous:
  # t4_cc678a20a3d0_m2 travelled 5.765 nm, returned under 1.0 and stayed, so
  # it scored held while spending 23% of the run outside the pocket, ranked
  # beside molecules that never left. 0.95 keeps the clean holds together and
  # sends the excursions to their own band.
  held_residence_floor: 0.95
  bound_rmsd_nm: 1.2
  replicates: 1              # >1 only where a claim rests on one trajectory

# ---------------------------------------------------------------------------
# Chemistry the run must agree on before it starts
# ---------------------------------------------------------------------------
chemistry:
  # @tt8804, 2026-08-11: dock the species that exists at assay pH, and correct
  # the warhead library to match. Docking a neutral form into a pocket whose
  # recognition is charged gives poses that are plausible and meaningless.
  docked_species: ph_7.4
  ph: 7.4
  # A molecule whose pH 7.4 form could not be built is STAMPED and excluded, not
  # quietly docked as the neutral -- that substitution is the defect (#58).
  require_docked_species_ok: true
  require_inchikey: true     # the only identifier here that survives a lost wedge
