# T_4 — sulfopin, warhead x R-group combinatorial (covalent)
#
# Purpose: T_4's parameters, including which warhead evidence tiers it enumerates.
# Author:  Mike Hallett (with Claude Code)
# Date:    2026-07-27

approach:
  id: t4
  name: "warhead x R-group combinatorial"
  seed: sulfopin           # core fixed, BOTH attachment points open (two-point)
  mechanism: covalent
  inhibition_proxy_strength: strong

warheads:
  # STEM, NOT A VERSION. Resolved at load time by
  # `warhead_library.DEFAULT_LIBRARY`, which globs for the highest version on
  # disk. This pinned `_3` while enumeration ran off `_10`.
  library: data/reference/warhead_classes_<latest>.csv

  # OPT-IN BEYOND VERIFIED (PI decision, 2026-07-27).
  #
  # Four classes carry a verified chemotype but an UNTESTED attachment
  # regiochemistry: BDHI can attach at C4 or C5 (C3 bears the Br and is where
  # Cys attacks, so it is unavailable), and 1,4-naphthoquinone at C2 or on the
  # benzo ring (C2/C3 are the Michael acceptor positions).
  #
  # Rather than choose by intuition, all four are enumerated as SEPARATE classes
  # and the gates decide. This is cheap: the discriminating evidence arrives
  # from steps we were running anyway.
  allow_statuses: [VERIFIED, DESIGNED_UNTESTED]

  # What actually distinguishes the competing regiochemistries:
  #   step 5b  — is the attached warhead still a genuine electrophile of its
  #              class, or did coupling kill it?
  #   step 6   — can Cys113 SG reach the reactive atom with the core in the way?
  #              A blocked approach shows up as poor covalent docking geometry.
  #   step 7   — is its LUMO inside the window bounded by real actives?
  # A regiochemistry that fails 5b is not a chemistry opinion, it is a fact.
  discriminated_by: [warhead_validity_gate_5b, covalent_docking_geometry, lumo_window]

  # DESIGNED_UNTESTED classes are exploratory: they may NOT anchor the
  # reactivity window (control B5) no matter how well they dock.
  anchor_eligible_statuses: [VERIFIED, VERIFIED_CLASS_ONLY]

enumeration:
  core_smiles: "N([1*])([2*])[C@@H]1CCS(=O)(=O)C1"
  # library_size is DERIVED and pinned by the enumeration stage, never inherited.
  # With 8 enumerable classes it is 8 x |R-group library|.
  library_size: 1782   # 9 warhead classes x 198 R-groups; pinned by 01_enumerate.py
  rgroup_library: data/reference/rgroup_library_1.csv

ranking:
  # RANK WITHIN WARHEAD CLASS, NOT GLOBALLY (step 8).
  #
  # gnina's affinity is not comparable across warhead classes here. Each class
  # docks against a DIFFERENT reactive-atom constraint, so the pose ensembles
  # are not drawn from one distribution, and classes differ in heavy-atom count,
  # which a Vina-style score tracks. A global sort would largely report which
  # class is biggest and greasiest.
  #
  # So each class is ranked against itself and contributes a fixed quota. The
  # shortlist becomes a designed comparison across chemotypes rather than a
  # league table one class monopolizes.
  per_class_quota: 3

  # Below this many successful docks, "best in class" is most of the class, and
  # the within-class rank is not selective. Such classes still contribute, but
  # their shortlist rows are flagged so nothing downstream reads the rank as
  # stronger evidence than it is.
  min_docked_for_meaningful_rank: 20

  # Classes stamped OUTSIDE_WINDOW by the reactivity triage (D0019) are ranked
  # and do contribute, carrying their flag. Dropping them here would silently
  # re-impose the kinetics filter the PI deliberately relaxed.
  include_flagged_classes: true

reporting:
  # If the two BDHI regiochemistries (or the two naphthoquinone ones) survive to
  # ranking, report them SEPARATELY rather than merging. Which attachment works
  # is a finding worth carrying, not an implementation detail to collapse.
  keep_regiochemistries_separate: true
