# T_2 — derivative neighborhood of ATRA (non-covalent)
#
# Purpose: T_2's parameters, including the fragment source and context radius.
# Author:  Mike Hallett (with Claude Code)
# Date:    2026-07-27

approach:
  id: t2
  name: "derivative neighborhood of ATRA"
  seed: atra
  mechanism: non_covalent
  inhibition_proxy_strength: weak     # reversible occupancy; see D0016

expansion:
  engine: crem

  # PRIMARY fragment source (D0018). Both databases are hash-pinned in
  # sources.lock.json; switching to Enamine is a one-line change here.
  fragment_db: /data/lab_vm/immutable/inhibition/fragment_db/chembl33_sa2_f5.db
  fragment_db_alternatives:
    - /data/lab_vm/immutable/inhibition/fragment_db/enamine2025_sa2_f5.db

  # THE parameter that defines the neighbourhood (D0018). Larger radius = more
  # surrounding context required for a swap = fewer but more chemically sensible
  # replacements.
  #
  # 2, NOT 3. Radius 3 was chosen first and refuted by a smoke test against the
  # actual seed: ATRA yields ZERO mutations and ZERO grows at radius 3, 4 and 5,
  # while giving 43/38 at radius 2. A control (benzoic acid, 47 mutations at
  # radius 3 from the same DB) rules out a broken setup — the cause is ATRA
  # itself, a conjugated polyene whose 3-bond context has no precedent in
  # ChEMBL33. At radius 3 T_2 would enumerate an empty frontier and report
  # success.
  #
  # THE USABLE RADIUS IS A PROPERTY OF THE SEED, NOT THE METHOD. Any new seed
  # needs this smoke test before its radius is pinned.
  radius: 2

  # Degree-bounded, NOT exhaustive (adversary finding B3). Degree-1 yields
  # 10^4-10^5; naive degree-2 reaches 10^8-10^10 and would feed ADMET, Vina and
  # MD and never finish.
  max_degree: 1
  frontier_cap: 200000

  # The governor (issue #1, note 2). Pocket-derived ceiling applied BETWEEN
  # enumeration and reseeding, so an oversized molecule never becomes a seed
  # and never spawns an oversized lineage. 55 is ~1.6x what the 1018 A^3
  # Pin1 catalytic site admits at tight packing, and clears every known
  # non-peptidic binder including BJP-06-005-3 at 52 heavy atoms. Loose on
  # purpose: it removes what cannot fit under any pose, nothing more.
  # Derivation and the test that pins it: shared/pocket_size.py.
  max_heavy_atoms: 55
  max_replacements: null          # null = take every valid replacement

  # PINNED, not inherited (D0018). CReM defaults max_size to 10 heavy atoms.
  # ATRA has 22, so the default would permit swapping nearly half the molecule —
  # hard to call a DERIVATIVE neighbourhood. An unstated default is exactly the
  # kind of parameter that turns out to have been doing the work.
  #
  # Measured effect on ATRA at radius 2: mutate gives 203 with these pins vs 239
  # at the defaults, and grow gives 1,679 — so grow dominates the frontier
  # (union 1,882). Worth knowing which operator is actually generating the
  # neighbourhood before tuning either.
  #
  # NOTE the naming trap: `radius` is the context that must MATCH (larger =
  # STRICTER = FEWER variants), while `max_size` is the size of the incoming
  # fragment (larger = MORE variants). They pull in opposite directions.
  # mutate_mol and grow_mol take DIFFERENT size parameters — grow_mol sets
  # min_size/max_size internally (it appends to hydrogens rather than replacing
  # a fragment) and takes min_atoms/max_atoms instead. Passing max_size to
  # grow_mol is a TypeError.
  mutate:
    max_size: 8                   # heavy atoms in the fragment being REPLACED
    min_size: 1
    max_inc: 4                    # cap net heavy-atom growth per edit
  grow:
    max_atoms: 8                  # heavy atoms in the fragment being ADDED
    min_atoms: 1
  replace_cycles: true            # ring systems may be swapped, not only chains
  protected_ids: null             # nothing anchored: the whole graph is mutable
  min_freq: 5                     # matches the f5 database

  # Dedupe each frontier by InChIKey BEFORE it seeds the next. Path multiplicity
  # is high — the same molecule is reachable by many edit sequences — so an
  # undeduped frontier explodes on the next breadth-first step.
  dedupe_by: inchikey

labelling:
  # Docking is demoted to a displayed label unless the enrichment gate says
  # otherwise. On this target it currently barely enriches (D0016: ROC-AUC
  # 0.535), so T_2's dock-based ranking is weakly supported.
  respect_enrichment_gate: true
  dock_subset_max: 2000

ranking:
  # T_2's rank_score is INTERNAL and never crosses the join (Rev 3 section 7).
  rank_metric: rank_score
  internal_only: true
  displayed_comparables: [vina_affinity, MW, cLogP, TPSA, QED, SAscore, novelty_external]
