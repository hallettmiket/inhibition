# External data sources — declarative acquisition.
#
# Purpose: every byte the choreography pulls from outside is declared here, so
#          staging a fresh machine (or a new target) is one command rather than
#          remembered shell history.
# Author:  Mike Hallett (with Claude Code)
# Date:    2026-07-27
#
# WHY THIS FILE EXISTS. The choreography is meant to be run many times and
# parameterized differently — a different receptor, a different generator
# checkpoint, a different fragment library. If acquisition lives in ad-hoc
# commands, then "how was this input obtained" is answerable only by whoever
# ran it, and only until they forget. Declared here, it is answerable by
# reading the repo.
#
# THIS FILE IS HAND-AUTHORED AND IS NEVER WRITTEN BY CODE.
# Observed hashes and resolved commits go to config/sources.lock.json, the way
# a dependency lockfile works. An earlier version of shared/sources.py wrote
# pins back into this file with yaml.safe_dump and silently erased every
# comment below — hence the split. Edit this file; read that one.

sources:

  receptor_6vaj:
    description: "Pin1 + sulfopin (QT7), covalent at Cys113, 1.42 A"
    kind: http
    url: "https://files.rcsb.org/download/6VAJ.pdb"
    dest: /data/lab_vm/immutable/inhibition/receptor/6VAJ.pdb
    required_by: [shared, t1, t2, t3, t4]
    notes: >
      The shared receptor. Every approach docks into the artifact derived from
      this file, so changing it invalidates all cross-approach comparison.

  diffsbdd_repo:
    description: "DiffSBDD — SE(3)-equivariant diffusion generator (T_1)"
    kind: git
    url: "https://github.com/arneschneuing/DiffSBDD.git"
    dest: /data/lab_vm/envs/_src/DiffSBDD
    required_by: [t1]

  diffsbdd_checkpoint:
    description: "DiffSBDD CrossDocked full-atom conditional checkpoint"
    kind: http
    url: "https://zenodo.org/record/8183747/files/crossdocked_fullatom_cond.ckpt?download=1"
    dest: /data/lab_vm/immutable/inhibition/weights/crossdocked_fullatom_cond.ckpt
    required_by: [t1]
    license: MIT
    notes: "Inference only — no retraining. Zenodo record 8183747."

  reinvent4_repo:
    description: "REINVENT 4 — generative decoration for T_3"
    kind: git
    url: "https://github.com/MolecularAI/REINVENT4.git"
    dest: /data/lab_vm/envs/_src/REINVENT4
    required_by: [t3]
    license: Apache-2.0
    notes: >
      Upstream dropped requirements-linux-64.lock (which the implementation
      plan named) in favour of pyproject + uv.lock + install.py. Recorded here
      because the plan's install note is stale.

  reinvent_priors:
    description: "REINVENT 4 prior models — libinvent prior needed by T_3"
    kind: http
    url: null               # pick the libinvent prior from the Zenodo record
    dest: /data/lab_vm/immutable/inhibition/weights/reinvent_priors/
    required_by: [t3]
    license: Apache-2.0
    notes: >
      NOT YET ACQUIRED. Priors are NOT bundled with the REINVENT repo; they live
      on Zenodo (doi 10.5281/zenodo.15641296). T_3 runs libinvent mode, so the
      libinvent prior specifically is required. Which prior is a decision worth
      recording, not a default.

  gnina:
    description: "gnina covalent docking binary — the ONE tool T_3 and T_4 share"
    kind: http
    url: "https://github.com/gnina/gnina/releases/download/v1.3.3/gnina.cuda12.8.static"
    dest: /data/lab_vm/immutable/inhibition/bin/gnina
    required_by: [shared, t3, t4]
    license: Apache-2.0
    notes: >
      Static binary, CUDA 12.8 runtime bundled; needs only a recent driver.
      Covalent docking requires gnina >= 1.3 for --covalent_rec_atom and
      --covalent_lig_atom_pattern. Pinned by release tag AND content hash:
      control S3 requires T_3 and T_4 to use the IDENTICAL tool, and "we both
      ran gnina" is not the same claim as "we both ran this binary".

  crem_fragment_db:
    description: "CReM fragment database mined from ChEMBL (T_2 expansion)"
    kind: http
    url: null               # set once the radius variant is chosen
    dest: /data/lab_vm/immutable/inhibition/fragment_db/
    required_by: [t2]
    notes: >
      NOT YET ACQUIRED. Separate ~GB download; the radius variant must be
      chosen and pinned before T_2 can enumerate, because a different radius
      is a different neighbourhood definition, not a tuning knob.

  decoys:
    description: "Property-matched decoys for the docking-enrichment gate"
    kind: generated          # built locally, not downloaded
    dest: /data/lab_vm/immutable/inhibition/decoys/
    required_by: [shared]
    notes: >
      NOT YET BUILT. Generated by the enrichment gate from the verified
      covalent-Cys113 actives; recorded here so the gate's inputs are declared
      alongside every other source rather than appearing from nowhere.

# Directories the choreography expects to exist under the governed roots.
# Created by shared/sources.py so a fresh machine needs no manual mkdir.
directories:
  immutable:
    - /data/lab_vm/immutable/inhibition/receptor
    - /data/lab_vm/immutable/inhibition/weights
    - /data/lab_vm/immutable/inhibition/fragment_db
    - /data/lab_vm/immutable/inhibition/decoys
    - /data/lab_vm/immutable/inhibition/bin
  append_only:
    - /data/lab_vm/append_only/inhibition
